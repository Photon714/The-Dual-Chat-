services:
  - type: web
    name: dual-chat-nextjs
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dual-chat-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: NODE_ENV
        value: production

  - type: web
    name: dual-chat-socket
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npx tsx server.ts
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dual-chat-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: dual-chat-db
    plan: free
