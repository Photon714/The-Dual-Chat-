services:
  - type: web
    name: dual-chat-socket
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npx tsx server.ts
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dual-chat-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: dual-chat-db
    plan: free
